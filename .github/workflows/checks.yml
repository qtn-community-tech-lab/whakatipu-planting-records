name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: >-
          npx vitest run
          --exclude tests/db-reads.test.ts
          --exclude tests/db-accountable.test.ts
          --exclude tests/supabase-parity.test.ts

  live-database:
    name: Live database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports without blocking until the hosted access rules match what these tests expect.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests against the hosted project, using the public key in .env
        run: npx vitest run tests/db-reads.test.ts tests/db-accountable.test.ts tests/supabase-parity.test.ts
